<!doctype html><meta charset="utf-8"><title>コインプッシャー 構造確認</title><style>body{margin:0;background:#17212c;color:white;font:16px sans-serif}#controls{position:fixed;top:10px;left:10px}button{padding:12px}</style><script src="../vendor/three.min.js"></script><script src="../vendor/rapier-0.21.0.js"></script><script src="../assets/coin-pusher.js"></script><script src="../coin-pusher-assets.js"></script><script src="../coin-pusher-state.js"></script><script src="../coin-pusher-physics.js"></script><div id="controls"><button id="left">左から投入</button><button id="right">右から投入</button><span id="stats"></span></div><script>
(async()=>{await RAPIER.init();const s=new ChillPusherState(CHILL_PUSHER_ASSETS.config,{hearts:()=>0,setHearts(){},save:()=>true});s.initialize('0:resident','0');s.state.wallets['0']=100;const m=new ChillPusherMachine(s,0),scene=new THREE.Scene(),r=new THREE.WebGLRenderer({antialias:true}),camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,10);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);scene.add(m.root,new THREE.HemisphereLight(0xffffff,0x8899aa,2));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(1,3,2);scene.add(l);camera.position.set(.06,1.95,1.7);camera.lookAt(0,1.04,0);for(const [id,side]of [['left','L'],['right','R']])document.getElementById(id).onclick=()=>s.insert(m.contextId,'0',side,'shot'+Date.now(),0);let t=performance.now();function frame(now){m.step(Math.min((now-t)/1000,1/60));t=now;r.render(scene,camera);document.getElementById('stats').textContent='獲得 '+(m.state.stats.front+m.state.stats.slot)+' / 投入 '+m.state.stats.inserted;requestAnimationFrame(frame)}requestAnimationFrame(frame);})();</script>
