<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住人の新モーション</title><style>body{margin:0;background:#edf1e5;color:#34413b;font-family:system-ui;padding:24px}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}article{background:#fffdf6;border-radius:18px;padding:16px;text-align:center}canvas{width:220px;height:220px;max-width:100%;background:#e3e9db;border-radius:12px}h2{font-size:16px}p{line-height:1.7}button{padding:10px 20px;border:0;border-radius:12px;background:#425e4c;color:white;cursor:pointer}</style><h1>住人の新モーション</h1><p>描き直したカートゥーン版です。「ほぅ～！」だけ口を開けます。<button id="pause">一時停止</button></p><main></main><script src="../assets/residents-v23.js"></script><script>
const items=[['denden','cheeks','ほぅ～！',0,16],['denden','turnjoy','喜びの振り向きダンス',0,16],['denden','dance','音楽に合わせたダンス',0,16],['denden','walk','デンデン：歩行と横顔',4,4],['tetsu','walk','モブテツ：歩行',0,4],['money','walk','モブマニー：歩行',0,4],['irukaeru','walk','イルカエル：歩行',0,4],['nyoro','walk','モブニョロ：歩行',0,4],['pink','walk','モブピンク：歩行',0,4],['nekokoo','walk','モブネコクー：歩行',0,4],['tetsu','action','モブテツ：素振りの体の動き',8,4],['money','domestic','モブマニー：掃除',4,4],['denden','taso','デンデン：のんびり',0,16]];let paused=false,time=0,last=0;document.querySelector('button').onclick=()=>{paused=!paused;document.querySelector('button').textContent=paused?'再生':'一時停止';};
Promise.all(items.map(async([key,kind,title,start,count])=>{const spec=CHILL_RESIDENTS23[key][kind],im=new Image();im.src=spec.url;await im.decode();const a=document.createElement('article'),h=document.createElement('h2'),cv=document.createElement('canvas');h.textContent=title;cv.width=cv.height=440;a.append(h,cv);const control=document.createElement('select');if(kind==='walk'){for(const [label,row]of [['正面',0],['左向き',key==='tetsu'?2:1],['右向き',key==='tetsu'?1:2],['後ろ',3]]){const option=new Option(label,row*4);control.add(option);}control.value=start;a.append(document.createElement('br'),control);}document.querySelector('main').append(a);const scale=Math.min(360/Math.max(...spec.rects.map(r=>r[2])),370/Math.max(...spec.rects.map(r=>r[3])));return{key,kind,im,cv,spec,start,count,scale,control:kind==='walk'?control:null};})).then(all=>{window.previewReady=true;function frame(now){if(!paused&&last)time+=Math.min(100,now-last);last=now;for(const o of all){const start=o.control?Number(o.control.value):o.start,n=Math.floor(time/200)%o.count,flip=o.key==='denden'&&o.kind==='walk'&&(start===0||start===12)&&n>=2,r=o.spec.rects[start+(flip?n-2:n)],c=o.cv.getContext('2d');c.clearRect(0,0,440,440);c.save();if(flip){c.translate(440,0);c.scale(-1,1);}c.drawImage(o.im,...r,220-r[2]*o.scale/2,412-r[3]*o.scale,r[2]*o.scale,r[3]*o.scale);c.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);});
</script></html>
